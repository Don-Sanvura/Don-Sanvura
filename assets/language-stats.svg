<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 250" width="100%" height="auto">
  <title id="title">Most-used languages</title>
  <desc id="desc">The automated language breakdown will appear after the first GitHub Actions run.</desc>
  <rect width="100%" height="100%" rx="18" fill="#0b1220"/>
  <text x="34" y="52" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Most-used languages</text>
