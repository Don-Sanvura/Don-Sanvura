name: Update public repository language statistics

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-language-stats.yml"
      - "scripts/generate_language_stats.py"

concurrency:
  group: public-language-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate language statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Don-Sanvura
          OUTPUT_FILE: assets/language-stats.svg
        run: python scripts/generate_language_stats.py

      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/language-stats.svg
          if git diff --cached --quiet; then
            echo "Language chart is already up to date."
            exit 0
          fi
          git commit -m "chore: update public repository language statistics"
          git push
