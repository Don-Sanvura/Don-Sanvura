name: Generate Tetris Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate Tetris Animation
        uses: mazipan/github-contribution-game@v1
        with:
          github_user_name: don-sanvura
          game_type: tetris
          output_branch: output
          output_filename: tetris-contribution-graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
