name: Generate Tetris Contribution Graph
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Tetris Contribution Graph
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // 1. Fetch this year's contribution calendar via GraphQL
            const query = `
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionCalendar {
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                        }
                      }
                    }
                  }
                }
              }`;

            const result = await github.graphql(query, { login: context.repo.owner });
            const weeks = result.user.contributionsCollection.contributionCalendar.weeks;

            // 2. Layout constants
            const cell = 12, gap = 3, radius = 2;
            const cols = weeks.length;
            const rows = 7;
            const width = cols * (cell + gap) + gap;
            const height = rows * (cell + gap) + gap;

            const colorFor = (count) => {
              if (count === 0) return '#161B22';
              if (count < 3) return '#0E4429';
              if (count < 6) return '#006D32';
              if (count < 10) return '#26A641';
              return '#39D353';
            };

            // 3. Draw each day as a "block", falling in from the top (tetris feel via animation)
            let blocks = '';
            weeks.forEach((week, x) => {
              week.contributionDays.forEach((day, y) => {
                const targetY = gap + y * (cell + gap);
                const cx = gap + x * (cell + gap);
                const fill = colorFor(day.contributionCount);
                const delay = (x * rows + y) * 0.01;
                blocks += `
                  <rect x="${cx}" y="-${cell}" width="${cell}" height="${cell}" rx="${radius}"
                    fill="${fill}" stroke="#0D1117" stroke-width="1">
                    <animate attributeName="y" from="-${cell}" to="${targetY}"
                      begin="${delay}s" dur="0.4s" fill="freeze" calcMode="spline"
                      keySplines="0.2 0.8 0.2 1" />
                  </rect>`;
              });
            });

            const svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"
              xmlns="http://www.w3.org/2000/svg">
              <rect width="${width}" height="${height}" fill="#0D1117" rx="8"/>
              ${blocks}
            </svg>`;

            fs.mkdirSync('assets', { recursive: true });
            fs.writeFileSync('assets/tetris-contribution-graph.svg', svg);
            console.log('Tetris contribution graph generated.');

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/tetris-contribution-graph.svg
          git diff --staged --quiet || (git commit -m "Update tetris contribution graph" && git push)
